<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dumuni-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A33"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E05D00"/>
    </linearGradient>
    <linearGradient id="dumuni-shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Rounded square background with subtle border -->
  <rect x="3" y="3" width="58" height="58" rx="14" ry="14"
        fill="url(#dumuni-orange)" filter="url(#soft-shadow)"/>

  <!-- Highlight gloss on top -->
  <rect x="3" y="3" width="58" height="29" rx="14" ry="14"
        fill="url(#dumuni-shine)"/>

  <!-- White "D" monogram with integrated bowl/curve (food delivery mark) -->
  <path d="M 17 16
           L 17 48
           L 35 48
           Q 47 48 47 36.5
           Q 47 32  44.5 28.5
           Q 43 26  40.5 24
           Q 48 20.5 48 16
           Q 48 12 44 12
           L 35 12
           Q 29 12 25 14
           Q 21 16 19 20
           L 19 16 Z
           M 22 20
           L 22 44
           L 34 44
           Q 42 44 42 36.5
           Q 42 33 39.5 30
           Q 43 27 43.5 22.5
           Q 44 18 38 18
           L 30 18
           Q 26 18 23 19
           Z"
        fill="#ffffff" fill-rule="evenodd"/>

  <!-- Subtle steam/dot accent representing hot food -->
  <circle cx="44.5" cy="20" r="1.8" fill="#ffffff" fill-opacity="0.85"/>
  <circle cx="49" cy="14" r="1.2" fill="#ffffff" fill-opacity="0.55"/>
</svg>
